<!-- ===== El Badawy Gym – WordPress page (responsive) =====
     الصق الكود كله في بلوك "HTML مخصص" (Custom HTML) داخل الصفحة -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@500;700;900&display=swap" rel="stylesheet">
<style>
body:has(.bdw){overflow-x:hidden}
.bdw{--gold1:#ffe27a;--gold2:#f2b705;--gold3:#a87400;--silver1:#fff;--silver2:#c9ccd1;--silver3:#7d828a;
  position:relative;box-sizing:border-box;width:100vw;max-width:100vw;margin-left:calc(50% - 50vw);
  min-height:100vh;min-height:100dvh;display:flex;align-items:center;justify-content:center;
  padding:clamp(28px,6vw,72px) max(clamp(18px,5vw,64px),env(safe-area-inset-right)) clamp(28px,6vw,72px) max(clamp(18px,5vw,64px),env(safe-area-inset-left));
  background:radial-gradient(ellipse at 50% 25%,#1a1405 0%,#000 65%);color:#fff;direction:rtl;
  font-family:'Cairo',Tahoma,Arial,sans-serif;overflow:hidden}
.bdw *{box-sizing:border-box}
.bdw-glow{position:absolute;top:50%;left:50%;width:min(720px,120vw);aspect-ratio:1;transform:translate(-50%,-50%);
  background:radial-gradient(circle,rgba(242,183,5,.18),transparent 65%);pointer-events:none;animation:bdw-pulse 6s ease-in-out infinite}
.bdw-wrap{position:relative;z-index:1;width:100%;max-width:1100px;display:grid;grid-template-columns:1fr;
  gap:clamp(18px,4vw,40px);justify-items:center;text-align:center}
.bdw-logo{width:clamp(180px,56vw,340px);height:auto;aspect-ratio:1;display:block;border-radius:50%;
  animation:bdw-in 1s ease-out both,bdw-float 6s ease-in-out 1s infinite}
.bdw-text{display:flex;flex-direction:column;align-items:center;width:100%;max-width:560px}
.bdw h1{margin:0 0 12px;font-size:clamp(1.8rem,7vw,3.4rem);font-weight:900;line-height:1.3;
  background:linear-gradient(180deg,var(--silver1),var(--silver2) 50%,var(--silver3));-webkit-background-clip:text;background-clip:text;color:transparent}
.bdw p{margin:0;font-size:clamp(1rem,3.4vw,1.2rem);line-height:1.9;color:#d6d6d6;font-weight:500}
.bdw-line{width:min(280px,70%);height:3px;margin:clamp(18px,3vw,28px) 0;border-radius:3px;
  background:linear-gradient(90deg,transparent,var(--gold2),transparent)}
.bdw-btns{display:flex;flex-direction:column;gap:14px;width:100%;max-width:360px}
.bdw-btn{position:relative;overflow:hidden;display:block;width:100%;padding:16px 28px;border-radius:999px;font-weight:900;
  font-size:1.1rem;text-align:center;text-decoration:none!important;font-family:inherit;
  transition:transform .2s ease,box-shadow .2s ease,border-color .2s ease,color .2s ease;-webkit-tap-highlight-color:transparent}
.bdw-main{color:#1a1200!important;background:linear-gradient(180deg,var(--gold1),var(--gold2) 55%,var(--gold3));box-shadow:0 6px 24px rgba(242,183,5,.35)}
.bdw-main::after{content:"";position:absolute;top:0;left:-60%;width:40%;height:100%;
  background:linear-gradient(100deg,transparent,rgba(255,255,255,.55),transparent);transform:skewX(-20deg);animation:bdw-shine 5s ease-in-out 2s infinite}
.bdw-ghost{color:var(--silver2)!important;border:2px solid var(--silver3);background:transparent}
.bdw-btn:active{transform:scale(.98)}
.bdw-btn:focus-visible{outline:3px solid var(--gold1);outline-offset:3px}
.bdw small{display:block;margin-top:28px;color:var(--silver3);font-size:.85rem}
/* تاب وأكبر: أزرار جنب بعض */
@media (min-width:600px){
  .bdw-btns{flex-direction:row;max-width:none;justify-content:center}
  .bdw-btn{width:auto;min-width:200px}
}
/* لاب وشاشات كبيرة: تأثيرات الهوفر فقط */
@media (min-width:960px){
  .bdw-btn:hover{transform:translateY(-3px)}
  .bdw-main:hover{box-shadow:0 10px 32px rgba(242,183,5,.55)}
  .bdw-ghost:hover{border-color:var(--gold2);color:var(--gold1)!important}
}
/* موبايل بالعرض (ارتفاع قليل) */
@media (max-height:520px) and (orientation:landscape){
  .bdw-logo{width:min(160px,34vh)}
  .bdw h1{font-size:1.7rem}
  .bdw-btns{flex-direction:row;justify-content:center;max-width:none}
  .bdw-btn{width:auto;padding:12px 20px;font-size:1rem;min-width:0}
  .bdw small{margin-top:14px}
}
@keyframes bdw-in{from{opacity:0;transform:translateY(18px) scale(.97)}to{opacity:1;transform:none}}
@keyframes bdw-float{0%,100%{transform:translateY(0)}50%{transform:translateY(-8px)}}
@keyframes bdw-pulse{0%,100%{opacity:.7}50%{opacity:1}}
@keyframes bdw-shine{0%,60%{left:-60%}100%{left:130%}}
@media (prefers-reduced-motion:reduce){.bdw *{animation:none!important;transition:none!important}}
</style>
